name: bubblegen
description: A Bubble generator.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  # Material pulls in the framework's Cupertino widgets, which use
  # CupertinoIcons; without this font `flutter build web` warns it is missing.
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
